name: Weekly retrain

on:
  schedule:
    # 12:00 UTC every Sunday = 8am ET. Runs *after* the morning daily flow
    # so training data is as fresh as possible for the week.
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    if: github.repository == 'SammyBolger/statflow'
    permissions:
      # Needed so this workflow can commit newly-generated model cards
      # back to the repo. Nothing else is granted.
      contents: write
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pull silver/gold/mlartifacts from R2
        run: uv run python -m statflow.storage pull

      - name: Retrain models
        # Creates fresh XGBoost runs in mlartifacts/mlflow.db AND writes a
        # markdown model card to docs/model_cards/<experiment>/<run_id>.md.
        # Next daily flow's predict step reads the latest run from MLflow —
        # no manual model swap.
        run: uv run python -m statflow.models train

      - name: Push updated mlartifacts to R2
        if: success()
        run: uv run python -m statflow.storage push

      - name: Commit new model cards
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/model_cards/
          if git diff --cached --quiet; then
            echo "no new model cards to commit"
          else
            git commit -m "docs(model-cards): auto-generated by retrain ${{ github.run_id }}"
            git push
          fi

      # Slack failure notification — no-op if SLACK_WEBHOOK_URL isn't set.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":x: statflow *weekly retrain* failed — <${RUN_URL}|view logs>\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
