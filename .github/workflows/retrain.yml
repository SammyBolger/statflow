name: Weekly retrain

on:
  schedule:
    # 12:00 UTC every Sunday = 8am ET. Runs *after* the morning daily flow
    # so training data is as fresh as possible for the week.
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    if: github.repository == 'SammyBolger/statflow'
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Pull the latest silver/gold/mlartifacts from R2. Training reads
      # gold/features and appends new runs to mlartifacts/mlflow.db.
      - name: Pull silver/gold/mlartifacts from R2
        run: uv run python -m statflow.storage pull

      - name: Retrain models
        # Creates fresh XGBoost runs in mlartifacts/mlflow.db. Next daily
        # flow's predict step calls mlflow.search_runs(...order_by=start_time DESC)
        # and picks these up — no manual model swap needed.
        run: uv run python -m statflow.models train

      - name: Push updated mlartifacts to R2
        if: success()
        run: uv run python -m statflow.storage push
