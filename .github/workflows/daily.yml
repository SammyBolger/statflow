name: Daily pipeline

on:
  schedule:
    # 11:00 UTC daily = 7am ET, after most MLB games from the prior day
    # have posted final boxscores.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest
    if: github.repository == 'SammyBolger/statflow'
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Bronze parquet is large (~1.4 GB) and rebuildable — keep it in the
      # GH Actions cache, not R2. Silver / gold / mlartifacts (the "clean"
      # state that the dashboard reads) get pushed to R2 at the end.
      - name: Restore bronze cache
        uses: actions/cache@v4
        with:
          path: |
            data/bronze
          key: statflow-bronze-${{ github.run_id }}
          restore-keys: |
            statflow-bronze-

      # R2 holds the persistent silver/gold/mlartifacts state — same state the
      # hosted dashboard reads from. Pull fresh at start so we work off the
      # latest snapshot, not a stale local cache.
      - name: Pull silver/gold/mlartifacts from R2
        run: uv run python -m statflow.storage pull || echo "R2 empty (first run) — pipeline will populate it"

      - name: Run daily pipeline
        run: uv run python -m statflow.flows

      - name: Push updated silver/gold/mlartifacts to R2
        if: success()
        run: uv run python -m statflow.storage push

      - name: Save bronze cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/bronze
          key: statflow-bronze-${{ github.run_id }}
